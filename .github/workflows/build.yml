name: Build Kivy APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK with buildozer-action
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer-args: android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: bin/*.apk
